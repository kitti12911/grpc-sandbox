# Generated mapper functions for the user feature. Hand-edits in
# internal/feature/user/mapper_generated.go are overwritten; targets sharing
# `out:` get merged into one file with deduplicated imports.
#
# Two hand-written helpers remain in mapper.go:
#   - toProtoUserStatus / userStatusFromProto (string<->enum bridge)
#   - updateParamsFromProto, patchParamsFromProto (compose CreateParams)
#
# Worker mapping is left hand-written: its Payload converter is fallible
# (json.RawMessage with marshal error) which protomapgen does not model.
targets:
    # ------------------------------------------------------------------
    # Response direction: bun model -> proto
    # ------------------------------------------------------------------
    - go_dir: internal/database
      go_import: grpc-sandbox/internal/database
      go_type: User
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: User
      direction: to_proto
      func_to_proto: toProtoUser
      package: user
      out: internal/feature/user/mapper_generated.go
      exclude: [DeletedAt]
      converters:
          Status: { to_proto: toProtoUserStatus }
          Profile: { to_proto: toProtoUserProfile }

    - go_dir: internal/database
      go_import: grpc-sandbox/internal/database
      go_type: UserProfile
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: UserProfile
      direction: to_proto
      func_to_proto: toProtoUserProfile
      package: user
      out: internal/feature/user/mapper_generated.go
      exclude: [ID, UserID, CreatedAt, UpdatedAt, User]
      converters:
          Address: { to_proto: toProtoUserAddress }

    - go_dir: internal/database
      go_import: grpc-sandbox/internal/database
      go_type: UserAddress
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: UserAddress
      direction: to_proto
      func_to_proto: toProtoUserAddress
      package: user
      out: internal/feature/user/mapper_generated.go
      exclude: [ID, UserProfileID, CreatedAt, UpdatedAt, Profile]

    # ------------------------------------------------------------------
    # Request direction: proto -> plain params struct
    # No `unwrap:` — keeps the bare signature so updateParamsFromProto
    # and patchParamsFromProto can compose createParamsFromProto.
    # ------------------------------------------------------------------
    - go_dir: internal/feature/user
      go_import: grpc-sandbox/internal/feature/user
      go_type: CreateParams
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: User
      direction: from_proto
      target_pointer: false
      func_from_proto: createParamsFromProto
      package: user
      out: internal/feature/user/mapper_generated.go
      converters:
          Status: { from_proto: userStatusFromProto }
          Profile: { from_proto: createProfileParamsFromProto }

    - go_dir: internal/feature/user
      go_import: grpc-sandbox/internal/feature/user
      go_type: CreateProfileParams
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: UserProfile
      direction: from_proto
      target_pointer: true
      func_from_proto: createProfileParamsFromProto
      package: user
      out: internal/feature/user/mapper_generated.go
      converters:
          Address: { from_proto: createAddressParamsFromProto }

    - go_dir: internal/feature/user
      go_import: grpc-sandbox/internal/feature/user
      go_type: CreateAddressParams
      proto_import: grpc-sandbox/gen/grpc/user/v1
      proto_type: UserAddress
      direction: from_proto
      target_pointer: true
      func_from_proto: createAddressParamsFromProto
      package: user
      out: internal/feature/user/mapper_generated.go
